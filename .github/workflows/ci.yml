name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,dev,onnxruntime]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  design-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The platform's themaker-ui copy matches the kit
        run: |
          curl -sSfL -o /tmp/kit.css \
            https://raw.githubusercontent.com/themakerrobot/themaker-ui/v1.0.0/themaker-ui.css
          diff -u /tmp/kit.css platform/static/css/themaker-ui.css

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
