<!doctype html>
<meta charset="utf-8">
<title>rtdetr — labelling</title>
<style>
  :root { color-scheme: dark; --bg:#14161a; --panel:#1c2027; --line:#2c323c; --ink:#e6e9ef; --dim:#8b94a3; --accent:#4da3ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; height:100vh; }
  aside { width:250px; flex:none; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  aside h1 { font-size:15px; margin:0; padding:14px 16px; border-bottom:1px solid var(--line); letter-spacing:.02em; }
  .classes { padding:10px 12px; border-bottom:1px solid var(--line); }
  .cls { display:flex; align-items:center; gap:8px; width:100%; padding:6px 8px; margin:2px 0; border:1px solid transparent; border-radius:6px; background:none; color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
  .cls:hover { background:#232833; }
  .cls[aria-pressed="true"] { border-color:var(--accent); background:#1d2836; }
  .swatch { width:12px; height:12px; border-radius:3px; flex:none; }
  .key { margin-left:auto; color:var(--dim); font-size:12px; }
  .files { flex:1; overflow:auto; padding:8px 0; }
  .file { display:flex; gap:8px; padding:5px 16px; cursor:pointer; color:var(--dim); }
  .file:hover { background:#232833; }
  .file[aria-current="true"] { background:#1d2836; color:var(--ink); }
  .file .dot { width:7px; height:7px; border-radius:50%; background:#39404d; margin-top:7px; flex:none; }
  .file.done .dot { background:#3ecf8e; }
  .file span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
  button { background:#252b35; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px 11px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { background:#2e3542; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#08101c; font-weight:600; }
  .grow { flex:1; }
  .status { color:var(--dim); font-size:13px; }
  .stage { flex:1; overflow:auto; display:grid; place-items:center; padding:16px; }
  .canvas-wrap { position:relative; line-height:0; }
  canvas { max-width:100%; touch-action:none; cursor:crosshair; }
  footer { padding:8px 14px; border-top:1px solid var(--line); color:var(--dim); font-size:12.5px; }
  kbd { background:#252b35; border:1px solid var(--line); border-radius:4px; padding:0 5px; font:inherit; font-size:12px; }
</style>

<aside>
  <h1>rtdetr labelling</h1>
  <div class="classes" id="classes"></div>
  <div class="files" id="files"></div>
</aside>

<main>
  <header>
    <button id="prev">← 이전</button>
    <button id="next">다음 →</button>
    <button id="auto">자동 라벨</button>
    <button id="clear">모두 지우기</button>
    <span class="grow"></span>
    <span class="status" id="status"></span>
    <button id="yaml">data.yaml 쓰기</button>
  </header>
  <div class="stage"><div class="canvas-wrap"><canvas id="canvas"></canvas></div></div>
  <footer>
    드래그로 상자 그리기 · <kbd>1</kbd>–<kbd>9</kbd> 클래스 · 상자 클릭 후 <kbd>Del</kbd> 삭제 ·
    <kbd>←</kbd> <kbd>→</kbd> 이미지 이동 · 저장은 자동
  </footer>
</main>

<script>
const COLORS = ["#ff5a5a","#4da3ff","#3ecf8e","#ffb648","#c07cff","#39d5d5","#ff7ac0","#9dd23a","#ff9060"];
const $ = (id) => document.getElementById(id);
const canvas = $("canvas"), ctx = canvas.getContext("2d");

let state = null, index = 0, boxes = [], img = new Image(), cls = 0, selected = -1;
let drag = null, dirty = false;

async function api(path, options) {
  const res = await fetch(path, options);
  if (!res.ok && res.status !== 503) throw new Error(path + " → " + res.status);
  return res.json();
}

async function boot() {
  state = await api("/api/state");
  $("auto").disabled = !state.can_autolabel;
  renderClasses();
  renderFiles();
  await load(0);
  document.addEventListener("keydown", onKey);
}

function renderClasses() {
  $("classes").innerHTML = "";
  state.names.forEach((name, i) => {
    const b = document.createElement("button");
    b.className = "cls";
    b.setAttribute("aria-pressed", i === cls);
    b.innerHTML = `<span class="swatch" style="background:${COLORS[i % COLORS.length]}"></span>
                   <span>${name}</span><span class="key">${i < 9 ? i + 1 : ""}</span>`;
    b.onclick = () => { cls = i; renderClasses(); if (selected >= 0) { boxes[selected].cls = i; touch(); } };
    $("classes").append(b);
  });
}

function renderFiles() {
  $("files").innerHTML = "";
  state.images.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "file" + (f.labelled ? " done" : "");
    row.setAttribute("aria-current", i === index);
    row.innerHTML = `<span class="dot"></span><span>${f.name}</span>`;
    row.onclick = () => load(i);
    $("files").append(row);
  });
  const done = state.images.filter((f) => f.labelled).length;
  $("status").textContent = `${index + 1} / ${state.images.length} · 라벨 완료 ${done}`;
}

async function load(i) {
  if (dirty) await save();
  index = i; selected = -1;
  const data = await api(`/api/labels/${i}`);
  boxes = data.boxes;
  await new Promise((done) => { img.onload = done; img.src = `/api/image/${i}?t=${Date.now()}`; });
  canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
  renderFiles(); draw();
}

function draw() {
  ctx.drawImage(img, 0, 0);
  const lw = Math.max(2, Math.round((canvas.width + canvas.height) / 700));
  ctx.lineWidth = lw; ctx.font = `${lw * 7}px system-ui, sans-serif`; ctx.textBaseline = "top";
  boxes.forEach((b, i) => {
    const [x, y, w, h] = pixels(b);
    const color = COLORS[b.cls % COLORS.length];
    ctx.strokeStyle = color; ctx.setLineDash(i === selected ? [lw * 3, lw * 2] : []);
    ctx.strokeRect(x, y, w, h);
    const text = state.names[b.cls] + (b.conf ? ` ${b.conf}` : "");
    const tw = ctx.measureText(text).width + lw * 4;
    const ty = y - lw * 9 >= 0 ? y - lw * 9 : y;
    ctx.setLineDash([]); ctx.fillStyle = color;
    ctx.fillRect(x, ty, tw, lw * 9);
    ctx.fillStyle = "#0b0d11"; ctx.fillText(text, x + lw * 2, ty + lw * 1.2);
  });
  if (drag) {
    ctx.strokeStyle = "#fff"; ctx.setLineDash([lw * 2, lw * 2]);
    ctx.strokeRect(drag.x0, drag.y0, drag.x1 - drag.x0, drag.y1 - drag.y0);
    ctx.setLineDash([]);
  }
}

const pixels = (b) => [ (b.cx - b.w / 2) * canvas.width, (b.cy - b.h / 2) * canvas.height,
                        b.w * canvas.width, b.h * canvas.height ];

function at(event) {
  const rect = canvas.getBoundingClientRect();
  return { x: (event.clientX - rect.left) * canvas.width / rect.width,
           y: (event.clientY - rect.top) * canvas.height / rect.height };
}

canvas.addEventListener("pointerdown", (e) => {
  const p = at(e);
  const hit = boxes.findIndex((b) => { const [x, y, w, h] = pixels(b);
    return p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h; });
  if (hit >= 0 && !e.shiftKey) { selected = hit; cls = boxes[hit].cls; renderClasses(); draw(); return; }
  canvas.setPointerCapture(e.pointerId);
  drag = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
});
canvas.addEventListener("pointermove", (e) => { if (drag) { const p = at(e); drag.x1 = p.x; drag.y1 = p.y; draw(); } });
canvas.addEventListener("pointerup", () => {
  if (!drag) return;
  const w = Math.abs(drag.x1 - drag.x0), h = Math.abs(drag.y1 - drag.y0);
  if (w > 4 && h > 4) {
    boxes.push({ cls, cx: (drag.x0 + drag.x1) / 2 / canvas.width, cy: (drag.y0 + drag.y1) / 2 / canvas.height,
                 w: w / canvas.width, h: h / canvas.height });
    selected = boxes.length - 1; touch();
  }
  drag = null; draw();
});

function touch() { dirty = true; draw(); save(); }

let saving = null;
async function save() {
  if (!dirty) return;
  dirty = false;
  saving = api(`/api/labels/${index}`, { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify({ boxes }) });
  await saving;
  state.images[index].labelled = true;
  renderFiles();
}

async function autolabel() {
  $("auto").disabled = true; $("status").textContent = "자동 라벨 중…";
  const res = await api(`/api/autolabel/${index}`, { method: "POST", headers: { "Content-Type": "application/json" },
                                                     body: JSON.stringify({ conf: 0.35 }) });
  $("auto").disabled = false;
  if (res.error) { $("status").textContent = "자동 라벨 실패: " + res.error; return; }
  boxes = boxes.concat(res.boxes); selected = -1; touch();
}

function onKey(e) {
  if (e.key === "ArrowRight") load(Math.min(index + 1, state.images.length - 1));
  else if (e.key === "ArrowLeft") load(Math.max(index - 1, 0));
  else if ((e.key === "Delete" || e.key === "Backspace") && selected >= 0) {
    boxes.splice(selected, 1); selected = -1; touch();
  } else if (e.key >= "1" && e.key <= "9") {
    const i = Number(e.key) - 1;
    if (i < state.names.length) { cls = i; renderClasses(); if (selected >= 0) { boxes[selected].cls = i; touch(); } }
  } else return;
  e.preventDefault();
}

$("prev").onclick = () => load(Math.max(index - 1, 0));
$("next").onclick = () => load(Math.min(index + 1, state.images.length - 1));
$("auto").onclick = autolabel;
$("clear").onclick = () => { boxes = []; selected = -1; touch(); };
$("yaml").onclick = async () => {
  const res = await api("/api/data_yaml", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  $("status").textContent = "wrote " + res.path;
};
window.addEventListener("beforeunload", save);
boot();
</script>
