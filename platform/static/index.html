<!doctype html>
<meta charset="utf-8">
<title>rtdetr platform</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314161a'/%3E%3Crect x='6.5' y='11' width='19' height='15' rx='2' fill='none' stroke='%234da3ff' stroke-width='2.6'/%3E%3Crect x='6.5' y='5.5' width='11' height='6.5' rx='1.6' fill='%234da3ff'/%3E%3Ccircle cx='16' cy='18.5' r='2.4' fill='%234da3ff'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --bg:#14161a; --panel:#1c2027; --line:#2c323c; --ink:#e6e9ef; --dim:#8b94a3; --accent:#4da3ff; --ok:#3ecf8e; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }   /* .row's flex must not beat hidden */
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header b { font-size:15px; letter-spacing:.02em; }
  header .dim { color:var(--dim); font-size:13px; }
  .wrap { display:grid; grid-template-columns:340px 1fr; gap:0; height:calc(100vh - 53px); }
  .col { overflow:auto; padding:16px 18px; }
  .col + .col { border-left:1px solid var(--line); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); margin:22px 0 10px; }
  h2:first-child { margin-top:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:12px 14px; margin-bottom:10px; }
  .card.click { cursor:pointer; }
  .card.click:hover { border-color:#3c444f; background:#20252e; }
  .card[aria-current="true"] { border-color:var(--accent); }
  .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .row > button { flex:none; }
  .row + .row { margin-top:7px; }
  .grow { flex:1; }
  .dim { color:var(--dim); }
  .tag { font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); }
  .tag.running, .tag.exporting { color:var(--accent); border-color:var(--accent); }
  .tag.done { color:var(--ok); border-color:var(--ok); }
  .tag.failed, .tag.cancelled { color:var(--bad); border-color:var(--bad); }
  label { display:block; font-size:12.5px; color:var(--dim); margin:9px 0 3px; }
  input, select { width:100%; background:#171b22; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  input[type=file] { padding:6px; }
  button { background:#252b35; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:7px 12px; font:inherit; cursor:pointer; }
  button:hover:not(:disabled) { background:#2e3542; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#08101c; font-weight:600; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tabs { display:flex; gap:6px; margin:12px 0 4px; }
  .tabs button { padding:5px 10px; font-size:13px; }
  .tabs button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  canvas#chart { width:100%; height:260px; background:var(--panel); border:1px solid var(--line); border-radius:9px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; }
  .msg { font-size:13px; margin-top:8px; min-height:19px; }
  .msg.err { color:var(--bad); }
  .bar { height:5px; border-radius:99px; background:#232833; margin-top:9px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); transition:width .3s; }
  .stats { margin-top:10px; border-top:1px solid var(--line); padding-top:9px; font-size:13px; }
  .stats table { width:100%; }
  .stats td { padding:2px 0; border:0; }
  .stats td:last-child { text-align:right; color:var(--dim); }
  .warn { color:#ffb648; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:10px; margin-top:10px; }
  .shot { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .shot img { width:100%; display:block; cursor:zoom-in; }
  .shot .cap { padding:5px 8px; font-size:12px; color:var(--dim); display:flex; }
  .shot .cap span:last-child { margin-left:auto; }
  .miss { color:var(--bad); }
  #cam, #cam-out { width:100%; border-radius:8px; margin-top:8px; display:block; }
  #jobs { max-height:42vh; overflow:auto; }   /* the open job stays in reach as the list grows */
  .detail { border-color:var(--accent); }
  .detail h2 { margin-top:16px; }
  .detail #detail-title { font-size:15px; }
  .legend { text-transform:none; letter-spacing:0; margin-left:10px; }
  .legend i { display:inline-block; width:10px; height:3px; margin:0 4px 3px 10px; vertical-align:middle; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:12.5px; padding:2px 9px; border-radius:99px; background:#232833; }
  #detail-close { padding:2px 9px; }
  img#preview { max-width:100%; border-radius:9px; border:1px solid var(--line); margin-top:10px; }
</style>

<header>
  <b>rtdetr platform</b>
  <span class="dim" id="status">…</span>
  <span class="grow"></span>
  <span class="dim">데이터셋 카드의 <b>라벨링</b>으로 상자를 그립니다</span>
</header>

<div class="wrap">
  <div class="col">
    <h2>수집</h2>
    <div class="card">
      <label>이름</label>
      <input id="ds-name" placeholder="cans-line-1">
      <label>기존 데이터셋에 추가 (비우면 새로 만듦)</label>
      <select id="ds-target"><option value="">새 데이터셋</option></select>

      <div class="tabs" id="ds-tabs">
        <button data-tab="images" aria-pressed="true">이미지</button>
        <button data-tab="video">영상</button>
        <button data-tab="zip">zip</button>
        <button data-tab="folder">폴더</button>
      </div>

      <div data-panel="images">
        <label>이미지 파일 (여러 장 선택 가능)</label>
        <input id="ds-images" type="file" accept="image/*" multiple>
      </div>
      <div data-panel="video" hidden>
        <label>영상 파일</label>
        <input id="ds-video" type="file" accept="video/*">
        <div class="two">
          <div><label>프레임 간격</label><input id="ds-every" type="number" value="30" min="1"></div>
          <div><label>최대 장수</label><input id="ds-max" type="number" value="300" min="1"></div>
        </div>
      </div>
      <div data-panel="zip" hidden>
        <label>zip — YOLO 형식 내보내기(Roboflow 등) 그대로, 또는 images/ + labels/</label>
        <input id="ds-file" type="file" accept=".zip">
      </div>
      <div data-panel="folder" hidden>
        <label>이 컴퓨터의 폴더 경로</label>
        <input id="ds-path" placeholder="/data/line-a/images">
        <label>클래스 (쉼표로 구분, 비우면 data.yaml 또는 자동)</label>
        <input id="ds-classes" placeholder="can, bottle">
      </div>

      <div class="row" style="margin-top:12px">
        <button class="primary" id="ds-upload">추가</button>
        <span class="msg" id="ds-msg"></span>
      </div>
    </div>

    <h2>데이터셋 <button id="merge" style="float:right;font-size:12px;padding:3px 8px" disabled>선택 병합</button></h2>
    <div id="datasets"></div>

    <h2>학습 시작</h2>
    <div class="card">
      <label>데이터셋</label>
      <select id="job-dataset"></select>
      <div class="tabs" id="presets">
        <button data-preset="fast">빠름</button>
        <button data-preset="balanced" aria-pressed="true">균형</button>
        <button data-preset="accurate">정확</button>
      </div>
      <div class="two">
        <div><label>모델</label>
          <select id="job-model">
            <option>rtdetr-r18</option><option>rtdetr-r34</option><option>rtdetr-r50</option>
          </select></div>
        <div><label>에폭</label><input id="job-epochs" type="number" value="20" min="1"></div>
        <div><label>입력 크기</label><input id="job-imgsz" type="number" value="640" step="32"></div>
        <div><label>배치</label><input id="job-batch" type="number" value="4" min="1"></div>
        <div><label>백본 고정</label>
          <select id="job-freeze"><option value="backbone">예 (빠름)</option><option value="">아니오</option></select></div>
        <div><label>검증 비율</label><input id="job-val" type="number" value="0.2" step="0.05" min="0.05" max="0.5"></div>
        <div><label>장치</label>
          <select id="job-device"><option value="">자동</option><option value="cpu">CPU</option><option value="0">GPU 0</option></select></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="job-start">학습 시작</button>
        <span class="msg" id="job-msg"></span>
      </div>
    </div>
  </div>

  <div class="col">
    <h2>작업</h2>
    <div id="jobs"></div>
    <div id="detail" class="card detail" hidden>
      <div class="row">
        <b id="detail-title"></b><span class="tag" id="detail-tag"></span>
        <span class="dim" id="detail-sub"></span><span class="grow"></span>
        <button id="detail-close" title="닫기">✕</button>
      </div>
      <div class="bar" id="detail-bar" hidden><i></i></div>
      <div class="msg" id="detail-msg"></div>
      <h2 id="chart-title">학습 곡선</h2>
      <canvas id="chart"></canvas>
      <div class="row" style="margin-top:10px">
        <button id="cancel">중지</button>
        <button id="evaluate">평가</button>
        <button id="resume">이어서 학습</button>
        <button id="dl-weights">best.pt</button>
        <button id="dl-ir">OpenVINO IR</button>
        <button id="dl-csv">results.csv</button>
        <button id="dl-log">로그</button>
        <button id="dl-pred">결과 zip</button>
        <button id="dl-video">영상</button>
        <button id="register">모델로 등록</button>
        <button id="delete-job" title="이 작업과 결과 파일을 지웁니다">삭제</button>
      </div>
      <div class="row" id="try-row" style="margin-top:8px">
        <span class="dim">이 모델로 시험:</span>
        <input id="try-file" type="file" accept="image/*" style="width:auto;flex:1;min-width:180px">
        <input id="try-conf" type="number" value="0.25" step="0.05" min="0" max="1" style="width:80px" title="conf">
        <button id="try">이 모델로 추론</button>
      </div>
      <img id="preview" hidden>
      <div id="pred" hidden>
        <div class="row" id="pred-summary"></div>
        <div class="gallery" id="pred-gallery"></div>
        <div class="dim" id="pred-more"></div>
      </div>
      <div id="report" hidden>
        <h2>평가</h2>
        <div class="card" id="report-summary"></div>
        <div class="gallery" id="gallery"></div>
      </div>
      <h2 id="epochs-title">에폭</h2>
      <table id="epochs-table"><thead><tr><th>#</th><th>loss</th><th>mAP50-95</th><th>초</th></tr></thead>
        <tbody id="epochs"></tbody></table>
    </div>
    <h2>추론</h2>
    <div class="card">
      <div class="two">
        <div><label>모델</label><select id="run-model"></select></div>
        <div><label>conf</label><input id="run-conf" type="number" value="0.25" step="0.05" min="0" max="1"></div>
      </div>
      <div class="tabs" id="run-tabs">
        <button data-run="dataset" aria-pressed="true">데이터셋</button>
        <button data-run="path">폴더 경로</button>
        <button data-run="video">영상</button>
        <button data-run="webcam">웹캠</button>
      </div>
      <div data-runpanel="dataset"><select id="run-dataset"></select></div>
      <div data-runpanel="path" hidden><input id="run-path" placeholder="/data/새-촬영분"></div>
      <div data-runpanel="video" hidden><input id="run-video" type="file" accept="video/*"></div>
      <div data-runpanel="webcam" hidden>
        <div class="row">
          <button id="cam-start">카메라 시작</button>
          <button id="cam-stop" disabled>정지</button>
          <span class="dim" id="cam-msg"></span>
        </div>
        <video id="cam" playsinline muted hidden></video>
        <img id="cam-out" hidden>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="primary" id="run-start">추론 실행</button>
        <span class="msg" id="run-msg"></span>
      </div>
    </div>

    <h2>모델</h2>
    <div class="card">
      <div id="models" class="dim">아직 등록된 모델이 없습니다.</div>
      <div class="row" style="margin-top:10px">
        <input id="model-file" type="file" accept=".pt,.xml,.bin,.onnx,.txt" multiple title="IR은 .xml과 .bin을 함께 고르세요" style="flex:1;min-width:150px">
        <input id="model-name" placeholder="이름" style="width:110px">
        <button id="model-upload">업로드</button>
      </div>
    </div>

  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let current = null, stream = null;

const api = async (path, options) => {
  const res = await fetch(path, options);
  const body = res.headers.get("content-type")?.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body.error || res.status);
  return body;
};
const fmt = (v, digits = 3) => (v === null || v === undefined || v === "" ? "—" : Number(v).toFixed(digits));
const short = (name) => String(name).split(/[\\/]/).pop();

let gpu = null, running = null, runPicked = false, listedAt = 0, listedStatus = null;

async function refresh() {
  const [state, datasets, jobs] = await Promise.all([
    api("/api/status"), api("/api/datasets"), api("/api/jobs")]);
  $("status").textContent =
    `데이터셋 ${state.datasets} · 대기 ${state.queued}` + (state.running_job ? ` · 실행 중 #${state.running_job}` : "")
    + (state.gpu ? ` · GPU ${state.gpu.name}` : " · GPU 없음 (CPU 학습)");
  running = state.running_job;
  if (state.gpu && !gpu) {                 // a GPU wants batches a CPU could not hold
    gpu = state.gpu;
    if ($("job-batch").value === "4") $("job-batch").value = "16";
  }

  $("datasets").innerHTML = datasets.map((d) => `
    <div class="card"><div class="row"><b>${d.name}</b><span class="grow"></span>
      <span class="tag">#${d.id}</span></div>
      <div class="row dim">이미지 ${d.images} · 라벨 ${d.labelled} · 클래스 ${d.classes.join(", ")}</div>
      <div class="row" style="margin-top:9px">
        <button onclick="location.assign('/label/${d.id}')">라벨링</button>
        <button data-autolabel="${d.id}">전체 자동 라벨</button>
        <button data-stats="${d.id}">통계</button>
      </div>
      <div class="row">
        <button onclick="location.assign('/api/datasets/${d.id}/export')">내보내기</button>
        <button data-duplicate="${d.id}">복제</button>
        <button data-delete="${d.id}">삭제</button>
        <label class="dim" style="margin-left:auto"><input type="checkbox" data-pick="${d.id}"> 병합 선택</label>
      </div>
      <div class="stats" id="stats-${d.id}" hidden></div>
    </div>`).join("") || `<div class="card dim">아직 없습니다.</div>`;
  document.querySelectorAll("[data-autolabel]").forEach((el) =>
    el.onclick = () => autolabelAll(Number(el.dataset.autolabel)));
  document.querySelectorAll("[data-delete]").forEach((el) =>
    el.onclick = () => removeDataset(Number(el.dataset.delete)));
  document.querySelectorAll("[data-stats]").forEach((el) =>
    el.onclick = () => showStats(Number(el.dataset.stats)));
  document.querySelectorAll("[data-duplicate]").forEach((el) =>
    el.onclick = () => duplicate(Number(el.dataset.duplicate)));
  document.querySelectorAll("[data-pick]").forEach((el) =>
    el.onchange = updateMergeButton);
  updateMergeButton();

  const options = datasets.map((d) =>
    `<option value="${d.id}">${d.name} (이미지 ${d.images})</option>`).join("");
  $("job-dataset").innerHTML = options;
  const keep = $("ds-target").value;
  $("ds-target").innerHTML = `<option value="">새 데이터셋</option>` + options;
  $("ds-target").value = keep;

  const registry = await api("/api/models");
  // a finished run is usable straight away — no need to register it first
  const trained = jobs.filter((j) => j.kind === "train" && j.status === "done" && j.run_dir)
    .map((j) => `<option value="${j.run_dir}/weights/best.pt">#${j.id} 학습 결과 · ${j.dataset}`
      + `${j.best_map != null ? ` (mAP ${fmt(j.best_map)})` : ""}</option>`).join("");
  const mine = trained ? `<optgroup label="내 학습 결과">${trained}</optgroup>` : "";
  const named = registry.models.length ? `<optgroup label="등록된 모델">`
    + registry.models.map((m) => `<option value="${m.id}">${m.name}</option>`).join("") + `</optgroup>` : "";
  const coco = `<optgroup label="COCO 사전학습 (80 클래스)">`
    + registry.builtin.map((n) => `<option value="${n}">${n}</option>`).join("") + `</optgroup>`;
  // training starts from COCO; using a model starts from what you trained
  for (const [id, html] of [["job-model", coco + named + mine], ["run-model", mine + named + coco]]) {
    const keep = $(id).value;
    $(id).innerHTML = html;
    if (keep && (id !== "run-model" || runPicked)) $(id).value = keep;
  }
  $("run-dataset").innerHTML = options;
  $("models").innerHTML = registry.models.length
    ? registry.models.map((m) => `<div class="row"><b>${m.name}</b>
        <span class="dim">${m.kind}${m.classes.length ? " · " + m.classes.join(", ") : ""}</span>
        <span class="grow"></span><button data-model="${m.id}">삭제</button></div>`).join("")
    : `<span class="dim">아직 등록된 모델이 없습니다. 학습 결과에서 "모델로 등록"을 누르세요.</span>`;
  document.querySelectorAll("[data-model]").forEach((el) => el.onclick = async () => {
    await api(`/api/models/${el.dataset.model}`, { method: "DELETE" }); await refresh();
  });

  $("jobs").innerHTML = jobs.map((j) => `
    <div class="card click" data-job="${j.id}" aria-current="${j.id === current}">
      <div class="row"><b>#${j.id} ${KIND[j.kind] || j.kind}</b>
        <span class="dim" title="${j.model}">${short(j.model)} · ${j.dataset || (j.source ? short(j.source) : "—")}</span>
        <span class="grow"></span>
        <span class="tag ${j.status}">${STATUS[j.status] || j.status}</span></div>
      <div class="row dim">${j.kind !== "train"
          ? `conf ${fmt(j.conf, 2)}${j.resume_of ? ` · #${j.resume_of}` : ""}`
          : `에폭 ${j.epochs} · ${j.imgsz}px · batch ${j.batch}${j.freeze ? " · 백본 고정" : ""}`}
        ${j.best_map != null ? ` · mAP50-95 ${fmt(j.best_map)}` : ""}
        ${j.started && j.finished ? ` · ${duration(j.finished - j.started)}` : ""}</div>
      ${["running", "exporting"].includes(j.status) ? `<div class="bar"><i style="width:${Math.round((j.progress || 0) * 100)}%"></i></div>` : ""}
      ${j.detail ? `<div class="row msg ${j.status === "failed" ? "err" : ""}">${j.detail}</div>` : ""}
    </div>`).join("") || `<div class="card dim">아직 없습니다.</div>`;
  document.querySelectorAll("[data-job]").forEach((el) =>
    el.onclick = () => select(Number(el.dataset.job)));
}

async function select(id, { scroll = true } = {}) {
  const fresh = current !== id;
  current = id;
  $("detail").hidden = false;
  if (fresh) { $("preview").hidden = true; predShown = { id: null, at: 0 }; }
  await refresh();
  const job = await api(`/api/jobs/${id}`);
  render(job);
  // started from a form further down: bring the job into view
  if (scroll && fresh) $("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
  if (stream) stream.close();
  if (["queued", "running", "exporting"].includes(job.status)) {
    stream = new EventSource(`/api/jobs/${id}/stream`);
    stream.onmessage = async (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === "end") { stream.close(); await select(id, { scroll: false }); return; }
      render(await api(`/api/jobs/${id}`));
      // the list above must not say "대기" for a job the view says is running:
      // at once when the status moves, every few seconds for progress
      if (msg.status !== listedStatus || Date.now() - listedAt > 3000) {
        listedStatus = msg.status; listedAt = Date.now(); refresh();
      }
    };
  }
}

const KIND = { train: "학습", autolabel: "자동 라벨", evaluate: "평가", predict: "추론" };
const STATUS = { queued: "대기", running: "실행 중", exporting: "내보내는 중", done: "완료",
                 failed: "실패", cancelled: "중지됨" };

function render(job) {
  const rows = job.epochs_done;
  const train = job.kind === "train";
  const active = ["queued", "running", "exporting"].includes(job.status);
  const has = (a) => job.artifacts.includes(a);

  $("detail-title").textContent = `#${job.id} ${KIND[job.kind] || job.kind}`;
  $("detail-tag").textContent = STATUS[job.status] || job.status;
  $("detail-tag").className = `tag ${job.status}`;
  const took = job.started && job.finished ? ` · ${duration(job.finished - job.started)} 걸림` : "";
  $("detail-sub").textContent = `${short(job.model)} · ${job.dataset || (job.source ? short(job.source) : "")}${took}`;

  const waiting = job.status === "queued"
    ? (running && running !== job.id ? `대기 중 — #${running}이(가) 끝나면 시작합니다` : "곧 시작합니다")
    : "";
  $("detail-msg").textContent = job.detail || waiting;
  $("detail-msg").className = "msg" + (job.status === "failed" ? " err" : "");
  const live = ["running", "exporting"].includes(job.status);
  $("detail-bar").hidden = !live;
  $("detail-bar").firstElementChild.style.width = `${Math.round((job.progress || 0) * 100)}%`;

  // only the buttons this job can use: a greyed row of eleven says nothing
  const show = {
    cancel: ["queued", "running"].includes(job.status),
    evaluate: train && has("weights"),
    resume: train && !active && job.status !== "queued",
    "dl-weights": has("weights"), "dl-ir": has("openvino"), "dl-csv": has("results"),
    "dl-log": has("log"), "dl-pred": has("predictions"), "dl-video": has("video"),
    register: train && has("weights"),
    "delete-job": !["running", "exporting"].includes(job.status),
  };
  Object.entries(show).forEach(([id, on]) => { $(id).hidden = !on; });
  $("try-row").hidden = !(train && has("weights"));

  $("chart").hidden = $("chart-title").hidden = !train;
  $("epochs-title").hidden = $("epochs-table").hidden = !train || !rows.length;
  $("epochs").innerHTML = rows.slice().reverse().map((r) =>
    `<tr><td>${r.epoch}</td><td>${fmt(r.loss)}</td><td>${fmt(r.map50_95)}</td><td>${fmt(r.seconds, 1)}</td></tr>`).join("");
  if (train) chart(rows, job.epochs);
  loadReport(job);
  loadPredictions(job);
}

let predShown = { id: null, at: 0 };

async function loadPredictions(job) {
  const panel = $("pred");
  if (job.kind !== "predict" || !job.run_dir) { panel.hidden = true; return; }
  // while it runs, redraw the gallery every few seconds rather than every event
  const finished = !["queued", "running"].includes(job.status);
  if (!finished && predShown.id === job.id && Date.now() - predShown.at < 4000) return;
  predShown = { id: job.id, at: Date.now() };
  let r;
  try { r = await api(`/api/jobs/${job.id}/predictions?limit=60`); } catch { panel.hidden = true; return; }
  const chips = Object.entries(r.per_class).map(([n, c]) => `<span class="chip">${n} ${c}</span>`).join("");
  $("pred-summary").innerHTML = finished
    ? `<b>${r.total}장 · 상자 ${r.boxes}개</b><span class="chips">${chips}</span>`
    : `<span class="dim">지금까지 그려진 결과 ${r.total}장</span>`;
  $("pred-gallery").innerHTML = r.files.map((f) => `
    <div class="shot">
      <img src="/api/jobs/${job.id}/output/${encodeURIComponent(f.file)}" loading="lazy" onclick="window.open(this.src)">
      <div class="cap"><span>${f.file.replace(/^\d+_/, "")}</span>
        <span class="${f.boxes === 0 ? "miss" : ""}">${f.boxes == null ? "" : `상자 ${f.boxes}`}</span></div>
    </div>`).join("");
  $("pred-more").textContent = r.total > r.files.length
    ? `처음 ${r.files.length}장만 보여줍니다 — 전부는 "결과 zip"으로 받으세요` : "";
  panel.hidden = !r.files.length;
}

function duration(seconds) {
  const s = Math.max(Math.round(seconds), 0);
  return s >= 3600 ? `${Math.floor(s / 3600)}시간 ${Math.floor(s % 3600 / 60)}분`
       : s >= 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s}초`;
}

function chart(rows, total) {
  const c = $("chart"), ctx = c.getContext("2d");
  const w = c.width = c.clientWidth * devicePixelRatio, h = c.height = 260 * devicePixelRatio;
  ctx.clearRect(0, 0, w, h);
  const pad = 38 * devicePixelRatio;
  ctx.strokeStyle = "#2c323c"; ctx.lineWidth = devicePixelRatio;
  ctx.beginPath(); ctx.moveTo(pad, 8); ctx.lineTo(pad, h - pad); ctx.lineTo(w - 8, h - pad); ctx.stroke();
  if (!rows.length) return;
  const line = (values, color, lo, hi) => {
    const points = values.map((v, i) => v == null ? null : [
      pad + (w - pad - 8) * (rows.length === 1 ? 0.5 : i / Math.max(total - 1, rows.length - 1)),
      h - pad - (h - pad - 8) * ((v - lo) / (hi - lo || 1))]).filter(Boolean);
    if (!points.length) return;
    ctx.strokeStyle = color; ctx.lineWidth = 2 * devicePixelRatio; ctx.beginPath();
    points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.stroke();
    points.forEach(([x, y]) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, 2.5 * devicePixelRatio, 0, 7); ctx.fill(); });
  };
  const losses = rows.map((r) => r.loss);
  line(losses, "#ff9060", Math.min(...losses) * 0.98, Math.max(...losses) * 1.02);
  const maps = rows.map((r) => r.map50_95);
  if (maps.some((v) => v != null)) line(maps, "#3ecf8e", 0, Math.max(0.05, ...maps.filter(Boolean)));
  ctx.fillStyle = "#8b94a3"; ctx.font = `${11 * devicePixelRatio}px system-ui`;
  ctx.fillText("loss", pad + 6 * devicePixelRatio, 18 * devicePixelRatio);
  ctx.fillStyle = "#3ecf8e";
  ctx.fillText("mAP50-95", pad + 46 * devicePixelRatio, 18 * devicePixelRatio);
}

$("ds-upload").onclick = async () => {
  const say = (text, bad) => { $("ds-msg").textContent = text; $("ds-msg").className = "msg" + (bad ? " err" : ""); };
  const target = $("ds-target").value;
  const name = $("ds-name").value.trim();
  const form = new FormData();
  if (target) form.append("dataset_id", target);

  let endpoint = null;
  if (tab === "images") {
    const files = [...$("ds-images").files];
    if (!files.length) return say("이미지를 고르세요", true);
    files.forEach((f) => form.append("files", f));
    form.append("name", name || "images");
    endpoint = "/api/datasets/images";
  } else if (tab === "video") {
    const file = $("ds-video").files[0];
    if (!file) return say("영상을 고르세요", true);
    form.append("video", file);
    form.append("name", name || file.name.replace(/\.[^.]+$/, ""));
    form.append("every", $("ds-every").value || "30");
    form.append("max_frames", $("ds-max").value || "300");
    endpoint = "/api/datasets/video";
  } else if (tab === "zip") {
    const file = $("ds-file").files[0];
    if (!file) return say("zip을 고르세요", true);
    form.append("archive", file);
    form.append("name", name || file.name.replace(/\.zip$/, ""));
    endpoint = "/api/datasets";
  }

  say("처리 중…");
  try {
    let res;
    if (tab === "folder") {
      const path = $("ds-path").value.trim();
      if (!path) return say("폴더 경로를 적으세요", true);
      const classes = $("ds-classes").value.split(",").map((c) => c.trim()).filter(Boolean);
      res = await api("/api/datasets/local", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path, name: name || undefined, names: classes.length ? classes : null }) });
    } else {
      res = await api(endpoint, { method: "POST", body: form });
    }
    const added = res.added ? `${res.added}장 추가 · ` : "";
    const classes = res.classes?.length ? ` · 클래스 ${res.classes.join(", ")}` : "";
    say(`${added}이미지 ${res.images} · 라벨 ${res.labelled}${classes}`);
    await refresh();
  } catch (e) { say(e.message, true); }
};

// --- webcam preview: frames go to the server, annotated frames come back ---
let camStream = null, camTimer = null;
$("cam-start").onclick = async () => {
  if (!window.isSecureContext || !navigator.mediaDevices) {
    // browsers only hand a camera to https:// or localhost pages; the server
    // runs an HTTPS twin for exactly this
    const { https_port } = await api("/api/status");
    if (https_port) {
      const secure = `https://${location.hostname}:${https_port}${location.pathname}`;
      $("cam-msg").innerHTML = `카메라는 https에서만 열립니다 → <a href="${secure}">${secure}</a> 에서 열기`
        + ` <span class="dim">(처음 한 번 뜨는 인증서 경고에서 '고급 → 계속')</span>`;
    } else {
      $("cam-msg").textContent = "브라우저는 https 또는 localhost 주소에서만 카메라를 허용합니다. "
        + "서버를 --https-port 와 함께 실행하세요.";
    }
    return;
  }
  try { camStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640 } }); }
  catch (e) { $("cam-msg").textContent = "카메라를 열 수 없습니다: " + e.message; return; }
  const video = $("cam");
  video.srcObject = camStream; video.hidden = false; await video.play();
  $("cam-start").disabled = true; $("cam-stop").disabled = false;

  const canvas = document.createElement("canvas");
  let busy = false;
  camTimer = setInterval(async () => {
    if (busy || video.videoWidth === 0) return;
    busy = true;
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.8));
    const form = new FormData();
    form.append("model", $("run-model").value);
    form.append("conf", $("run-conf").value || "0.25");
    form.append("image", blob, "frame.jpg");
    try {
      const res = await fetch("/api/preview", { method: "POST", body: form });
      if (res.ok) {
        const found = JSON.parse(res.headers.get("X-Detections") || "[]");
        $("cam-msg").textContent = found.length
          ? found.map((d) => `${d.name} ${d.confidence}`).join(", ") : "검출 없음";
        const out = $("cam-out");
        if (out.src) URL.revokeObjectURL(out.src);
        out.src = URL.createObjectURL(await res.blob()); out.hidden = false; video.hidden = true;
      } else { $("cam-msg").textContent = (await res.json()).error; }
    } catch (e) { $("cam-msg").textContent = e.message; }
    busy = false;
  }, 400);
};

$("cam-stop").onclick = () => {
  clearInterval(camTimer); camTimer = null;
  if (camStream) camStream.getTracks().forEach((t) => t.stop());
  camStream = null;
  $("cam").hidden = true; $("cam-out").hidden = true;
  $("cam-start").disabled = false; $("cam-stop").disabled = true; $("cam-msg").textContent = "";

  const files = [...$("model-file").files];
  if (!files.length) return;
  const main = files.find((f) => /\.(pt|onnx|xml)$/i.test(f.name)) || files[0];
  const form = new FormData();
  files.forEach((f) => form.append("files", f));       // an IR is .xml + .bin together
  form.append("name", $("model-name").value || main.name.replace(/\.[^.]+$/, ""));
  try { await api("/api/models/upload", { method: "POST", body: form });
    $("run-msg").textContent = "등록됨"; $("run-msg").className = "msg";
    $("model-file").value = "";
    await refresh(); }
  catch (e) { $("run-msg").textContent = e.message; $("run-msg").className = "msg err"; }
};

refresh();
setInterval(() => { if (!stream || stream.readyState === 2) refresh(); }, 4000);
</script>
