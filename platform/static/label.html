<!doctype html>
<meta charset="utf-8">
<title>라벨링 — easydetect</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6cf6'/%3E%3Crect x='7' y='10' width='18' height='14' rx='2.5' fill='none' stroke='white' stroke-width='2.4'/%3E%3Crect x='7' y='6' width='10' height='5' rx='1.5' fill='white'/%3E%3Ccircle cx='16' cy='17' r='2.2' fill='white'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>   /* the platform's theme, before the first paint */
  try { document.documentElement.dataset.theme = localStorage.getItem("theme")
          || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg:#eceef2; --surface:#ffffff; --sunk:#f0f2f5; --field:#ffffff;
    --line:#e3e6eb; --line-strong:#cfd4dc; --ink:#171a20; --dim:#5d6675; --faint:#98a1af;
    --accent:#3b6cf6; --accent-soft:#e9efff; --ok:#12a168; --bad:#d93f3f; --bad-soft:#fdecec;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#0b0d11; --surface:#15181e; --sunk:#1b1f26; --field:#11141a;
    --line:#242932; --line-strong:#323845; --ink:#e8eaee; --dim:#9098a6; --faint:#626a78;
    --accent:#5b8cff; --accent-soft:#1a2440; --ok:#3ccf91; --bad:#f26d6d; --bad-soft:#2d1717;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); display:flex; height:100vh;
         font:14px/1.5 Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
         -webkit-font-smoothing:antialiased; }
  aside { width:260px; flex:none; background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; }
  aside h1 { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; margin:0; padding:14px 16px;
             border-bottom:1px solid var(--line); overflow:hidden; }
  aside h1 a { color:var(--dim); text-decoration:none; font-size:18px; line-height:1; padding:2px 6px 4px; border-radius:6px; }
  aside h1 a:hover { background:var(--sunk); color:var(--ink); }
  aside h1 span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .section { font-size:11.5px; font-weight:700; color:var(--faint); text-transform:uppercase; letter-spacing:.06em; margin:0 0 6px 4px; }
  .classes { padding:12px; border-bottom:1px solid var(--line); }
  .cls { display:flex; align-items:center; gap:9px; width:100%; padding:6px 8px; margin:1px 0; border:1px solid transparent;
         border-radius:7px; background:none; color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
  .cls:hover { background:var(--sunk); }
  .cls[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-soft); }
  .swatch { width:12px; height:12px; border-radius:4px; flex:none; }
  .key { margin-left:auto; color:var(--faint); font-size:11.5px; font-family:ui-monospace, Consolas, monospace;
         border:1px solid var(--line); border-radius:4px; padding:0 5px; }
  .key:empty { display:none; }
  .count { color:var(--dim); font-size:12px; min-width:18px; text-align:right; font-variant-numeric:tabular-nums; }
  .row { display:flex; align-items:center; gap:6px; }
  .filter { padding:8px 12px; border-bottom:1px solid var(--line); color:var(--dim); font-size:13px; }
  .filter label { display:flex; align-items:center; gap:7px; cursor:pointer; }
  .filter input { width:auto; height:auto; accent-color:var(--accent); }
  input, #folder { height:32px; background:var(--field); color:var(--ink); border:1px solid var(--line-strong);
                   border-radius:7px; padding:0 9px; font:inherit; outline:none; }
  input:focus, #folder:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #folder { width:100%; }
  .files { flex:1; overflow:auto; padding:6px; }
  .file { display:flex; gap:9px; padding:5px 10px; border-radius:6px; cursor:pointer; color:var(--dim); font-size:13px; }
  .file:hover { background:var(--sunk); }
  .file[aria-current="true"] { background:var(--accent-soft); color:var(--ink); }
  .file .dot { width:7px; height:7px; border-radius:50%; background:var(--line-strong); margin-top:7px; flex:none; }
  .file.done .dot { background:var(--ok); }
  .file.empty .dot { background:none; box-shadow:inset 0 0 0 1.5px var(--ok); }  /* labelled: nothing in it */
  .file span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:10px 14px; background:var(--surface); border-bottom:1px solid var(--line); }
  .group { display:flex; gap:4px; padding-right:8px; margin-right:4px; border-right:1px solid var(--line); }
  button { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 11px; background:var(--surface); color:var(--ink);
           border:1px solid var(--line-strong); border-radius:7px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
  button:hover:not(:disabled) { background:var(--sunk); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover:not(:disabled) { background:var(--accent); filter:brightness(1.07); }
  button.danger { color:var(--bad); border-color:transparent; background:none; }
  button.danger:hover:not(:disabled) { background:var(--bad-soft); }
  .grow { flex:1; }
  .status { color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }
  .stage { flex:1; overflow:auto; display:grid; place-items:center; padding:20px; }
  canvas { touch-action:none; box-shadow:0 4px 24px rgba(0,0,0,.25); border-radius:2px; }
  footer { padding:8px 14px; border-top:1px solid var(--line); background:var(--surface); color:var(--faint); font-size:12px; }
  kbd { background:var(--sunk); border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:4px; padding:0 5px;
        font-size:11.5px; color:var(--dim); font-family:ui-monospace, Consolas, monospace; }
</style>

<aside>
  <h1><a href="/#data" title="플랫폼으로">←</a><span id="title">라벨링</span></h1>
  <div class="classes">
    <div class="section">클래스</div>
    <div id="classes"></div>
    <div class="row" style="margin-top:8px">
      <input id="new-class" placeholder="클래스 추가" style="flex:1;min-width:0">
      <button id="add-class" title="추가">+</button>
    </div>
  </div>
  <div class="row filter"><select id="folder" title="폴더별로 보기"></select></div>
  <div class="row filter"><label><input type="checkbox" id="only-unlabelled"> 라벨 없는 것만</label></div>
  <div class="files" id="files"></div>
</aside>

<main>
  <header>
    <div class="group">
      <button id="prev" title="이전 (←)">‹ 이전</button>
      <button id="next" title="다음 (→)">다음 ›</button>
    </div>
    <div class="group">
      <button id="auto" class="primary" title="모델이 상자 초안을 그립니다">자동 라벨</button>
      <button id="copy" title="이전 이미지의 상자를 그대로 가져옵니다 (C)">이전 상자 복사</button>
    </div>
    <div class="group">
      <button id="undo" title="Ctrl+Z">되돌리기</button>
      <button id="clear">모두 지우기</button>
      <button id="reset-zoom" hidden>100%</button>
    </div>
    <span class="grow"></span>
    <span class="status" id="status"></span>
    <button id="drop" class="danger" title="이 이미지와 라벨을 데이터셋에서 지웁니다">이미지 삭제</button>
  </header>
  <div class="stage"><canvas id="canvas"></canvas></div>
  <footer>
    드래그로 그리기 · 상자 안을 끌면 이동 · 모서리를 끌면 크기 조절 ·
    <kbd>1</kbd>–<kbd>9</kbd> 클래스 · <kbd>Del</kbd> 삭제 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 되돌리기 ·
    <kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>C</kbd> 이전 상자 복사 · 휠 확대 · 가운데 버튼(또는
    <kbd>Space</kbd>)으로 이동 · 저장 자동
  </footer>
</main>

<script>
const COLORS = ["#ff5a5a","#4da3ff","#3ecf8e","#ffb648","#c07cff","#39d5d5","#ff7ac0","#9dd23a","#ff9060"];
const $ = (id) => document.getElementById(id);
const canvas = $("canvas"), ctx = canvas.getContext("2d");
const DATASET = Number(location.pathname.split("/").pop());
const HANDLE = 9;               // grab radius for a corner, in screen pixels

let dataset = null, index = 0, boxes = [], img = new Image(), cls = 0, selected = -1;
let action = null, history = [], dirty = false;
let zoom = 1, baseWidth = 0, lastBoxes = [], onlyUnlabelled = false, spaceDown = false;
let folder = "";   // "" = every folder

const folderOf = (name) => name.includes("/") ? name.slice(0, name.lastIndexOf("/")) : "";
const inFolder = (f) => !folder || folderOf(f.name) === folder;
// what the list shows and what ←/→ step through: the chosen folder, and only
// unlabelled pictures when that box is ticked
const listed = (f) => inFolder(f) && !(onlyUnlabelled && f.labelled);

function renderFolders() {
  const counts = {};
  dataset.files.forEach((f) => { const d = folderOf(f.name); counts[d] = (counts[d] || 0) + 1; });
  const names = Object.keys(counts).sort();
  $("folder").hidden = names.length < 2;          // one folder: nothing to choose
  $("folder").innerHTML = `<option value="">모든 폴더 (${dataset.files.length})</option>`
    + names.map((d) => `<option value="${d}">${d || "(최상위)"} (${counts[d]})</option>`).join("");
  $("folder").value = folder;
}

function step(delta) {
  for (let i = index + delta; i >= 0 && i < dataset.files.length; i += delta) {
    if (listed(dataset.files[i])) return load(i);
  }
}

const api = async (path, options) => {
  const res = await fetch(path, options);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.status);
  return body;
};

async function boot() {
  dataset = await api(`/api/datasets/${DATASET}`);
  document.title = `${dataset.name} — 라벨링`;
  $("title").textContent = dataset.name;
  renderFolders(); renderClasses(); renderFiles();
  // open on a picture with boxes: exports often lead with background frames,
  // and an empty first page reads as labels that failed to load
  const first = dataset.files.findIndex((f) => f.boxes > 0);
  await load(Math.max(first, 0));
  document.addEventListener("keydown", onKey);
}

function renderClasses() {
  const counts = boxes.reduce((acc, b) => (acc[b.cls] = (acc[b.cls] || 0) + 1, acc), {});
  $("classes").innerHTML = "";
  dataset.classes.forEach((name, i) => {
    const b = document.createElement("button");
    b.className = "cls";
    b.setAttribute("aria-pressed", i === cls);
    b.innerHTML = `<span class="swatch" style="background:${COLORS[i % COLORS.length]}"></span>
                   <span>${name}</span><span class="count">${counts[i] || ""}</span>
                   <span class="key">${i < 9 ? i + 1 : ""}</span>`;
    b.onclick = () => setClass(i);
    $("classes").append(b);
  });
}

async function addClass() {
  const name = $("new-class").value.trim();
  if (!name) return;
  const names = [...dataset.classes, name];
  await api(`/api/datasets/${DATASET}/classes`, { method: "POST",
    headers: { "Content-Type": "application/json" }, body: JSON.stringify({ names }) });
  dataset.classes = names; $("new-class").value = "";
  cls = names.length - 1; renderClasses();
}

function setClass(i) {
  cls = i; renderClasses();
  if (selected >= 0 && boxes[selected].cls !== i) { push(); boxes[selected].cls = i; touch(); }
}

function renderFiles() {
  $("files").innerHTML = "";
  let shown = 0, position = 0;
  dataset.files.forEach((f, i) => {
    if (!listed(f) && i !== index) return;
    shown += 1;
    if (i === index) position = shown;
    const row = document.createElement("div");
    row.className = "file" + (f.boxes > 0 ? " done" : f.labelled ? " empty" : "");
    row.title = f.boxes > 0 ? `상자 ${f.boxes}개` : f.labelled ? "빈 라벨 (배경 이미지)" : "라벨 없음";
    row.setAttribute("aria-current", i === index);
    const label = folder ? f.name.slice(folder.length + 1) : f.name;   // the folder is already chosen
    row.innerHTML = `<span class="dot"></span><span>${label}</span>`;
    row.onclick = () => load(i);
    $("files").append(row);
  });
  const here = dataset.files.filter(inFolder);
  const done = here.filter((f) => f.labelled).length;
  $("status").textContent = `${position} / ${shown}${folder ? ` · ${folder}` : ""} · 라벨 완료 ${done}/${here.length}`;
}

async function load(i) {
  if (dirty) await save();
  if (boxes.length) lastBoxes = JSON.parse(JSON.stringify(boxes));
  index = i; selected = -1; history = [];
  boxes = (await api(`/api/datasets/${DATASET}/labels/${i}`)).boxes;
  await new Promise((done) => {
    img.onload = done;
    img.src = `/api/datasets/${DATASET}/image/${i}?t=${Date.now()}`;
  });
  canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
  fit(); renderFiles(); renderClasses(); draw();
}

function fit(keepZoom) {
  // the drawing buffer keeps the image's own resolution, so labels stay exact
  // whatever the zoom; only the CSS size changes
  const stage = canvas.parentElement.getBoundingClientRect();
  const room = Math.min((stage.width - 32) / canvas.width, (stage.height - 32) / canvas.height);
  baseWidth = Math.max(canvas.width * room, 100);
  if (!keepZoom) zoom = 1;
  applyZoom();
}

function applyZoom() {
  canvas.style.width = `${baseWidth * zoom}px`;
  $("reset-zoom").hidden = zoom === 1;
  $("reset-zoom").textContent = `${Math.round(zoom * 100)}%`;
}

canvas.parentElement.addEventListener("wheel", (e) => {
  if (!baseWidth) return;
  e.preventDefault();
  const before = canvas.getBoundingClientRect();
  const ax = (e.clientX - before.left) / before.width, ay = (e.clientY - before.top) / before.height;
  zoom = Math.min(Math.max(zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 1), 12);
  applyZoom();
  const after = canvas.getBoundingClientRect();
  const stage = canvas.parentElement;
  stage.scrollLeft += after.width * ax - before.width * ax;
  stage.scrollTop += after.height * ay - before.height * ay;
}, { passive: false });

window.addEventListener("resize", () => { fit(true); draw(); });

const pixels = (b) => [ (b.cx - b.w / 2) * canvas.width, (b.cy - b.h / 2) * canvas.height,
                        b.w * canvas.width, b.h * canvas.height ];
const scale = () => canvas.width / canvas.getBoundingClientRect().width;

function draw() {
  ctx.drawImage(img, 0, 0);
  const lw = Math.max(2, Math.round((canvas.width + canvas.height) / 700));
  ctx.lineWidth = lw; ctx.font = `${lw * 7}px system-ui, sans-serif`; ctx.textBaseline = "top";
  boxes.forEach((b, i) => {
    const [x, y, w, h] = pixels(b);
    const color = COLORS[b.cls % COLORS.length];
    ctx.strokeStyle = color; ctx.setLineDash(i === selected ? [lw * 3, lw * 2] : []);
    ctx.strokeRect(x, y, w, h);
    ctx.setLineDash([]);
    if (i === selected) {                       // grab handles on the selected box
      ctx.fillStyle = color;
      corners(b).forEach(([hx, hy]) =>
        ctx.fillRect(hx - lw * 2, hy - lw * 2, lw * 4, lw * 4));
    }
    const text = (dataset.classes[b.cls] ?? b.cls) + (b.conf ? ` ${b.conf}` : "");
    const tw = ctx.measureText(text).width + lw * 4;
    const ty = y - lw * 9 >= 0 ? y - lw * 9 : y;
    ctx.fillStyle = color; ctx.fillRect(x, ty, tw, lw * 9);
    ctx.fillStyle = "#0b0d11"; ctx.fillText(text, x + lw * 2, ty + lw * 1.2);
  });
  if (action?.kind === "new") {
    ctx.strokeStyle = "#fff"; ctx.setLineDash([lw * 2, lw * 2]);
    ctx.strokeRect(action.x0, action.y0, action.x1 - action.x0, action.y1 - action.y0);
    ctx.setLineDash([]);
  }
}

function corners(b) {
  const [x, y, w, h] = pixels(b);
  return [[x, y], [x + w, y], [x, y + h], [x + w, y + h]];
}

function at(event) {
  const rect = canvas.getBoundingClientRect();
  return { x: (event.clientX - rect.left) * scale(), y: (event.clientY - rect.top) * scale() };
}

function hitCorner(b, p) {
  const grab = HANDLE * scale();
  const found = corners(b).findIndex(([cx, cy]) => Math.abs(cx - p.x) < grab && Math.abs(cy - p.y) < grab);
  return found;
}

function inside(b, p) {
  const [x, y, w, h] = pixels(b);
  return p.x >= x && p.x <= x + w && p.y >= y && p.y <= y + h;
}

function push() { history.push(JSON.stringify(boxes)); if (history.length > 50) history.shift(); }
function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

canvas.addEventListener("pointerdown", (e) => {
  if (e.button === 1 || spaceDown) {            // pan instead of drawing
    const stage = canvas.parentElement;
    action = { kind: "pan", x: e.clientX, y: e.clientY,
               left: stage.scrollLeft, top: stage.scrollTop };
    canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }
  const p = at(e);
  canvas.setPointerCapture(e.pointerId);

  if (selected >= 0) {                       // corner of the selected box: resize
    const corner = hitCorner(boxes[selected], p);
    if (corner >= 0) { push(); action = { kind: "resize", corner, box: selected }; return; }
  }
  const hit = boxes.findIndex((b) => inside(b, p));
  if (hit >= 0 && !e.shiftKey) {             // inside a box: select, and drag to move
    selected = hit; cls = boxes[hit].cls; renderClasses();
    push();
    action = { kind: "move", box: hit, from: p, start: { ...boxes[hit] } };
    draw();
    return;
  }
  action = { kind: "new", x0: p.x, y0: p.y, x1: p.x, y1: p.y };
});

canvas.addEventListener("pointermove", (e) => {
  if (!action) { return; }
  if (action.kind === "pan") {
    const stage = canvas.parentElement;
    stage.scrollLeft = action.left - (e.clientX - action.x);
    stage.scrollTop = action.top - (e.clientY - action.y);
    return;
  }
  const p = at(e);
  p.x = clamp(p.x, 0, canvas.width); p.y = clamp(p.y, 0, canvas.height);   // never past the image
  if (action.kind === "new") { action.x1 = p.x; action.y1 = p.y; }
  else if (action.kind === "move") {
    const b = boxes[action.box], s = action.start;
    b.cx = clamp(s.cx + (p.x - action.from.x) / canvas.width, b.w / 2, 1 - b.w / 2);
    b.cy = clamp(s.cy + (p.y - action.from.y) / canvas.height, b.h / 2, 1 - b.h / 2);
    dirty = true;
  } else if (action.kind === "resize") {
    const b = boxes[action.box];
    const [x, y, w, h] = pixels(b);
    let x0 = x, y0 = y, x1 = x + w, y1 = y + h;
    if (action.corner === 0) { x0 = p.x; y0 = p.y; }
    if (action.corner === 1) { x1 = p.x; y0 = p.y; }
    if (action.corner === 2) { x0 = p.x; y1 = p.y; }
    if (action.corner === 3) { x1 = p.x; y1 = p.y; }
    b.cx = (x0 + x1) / 2 / canvas.width; b.cy = (y0 + y1) / 2 / canvas.height;
    b.w = Math.abs(x1 - x0) / canvas.width; b.h = Math.abs(y1 - y0) / canvas.height;
    dirty = true;
  }
  draw();
});

canvas.addEventListener("pointerup", () => {
  if (!action) return;
  if (action.kind === "pan") { action = null; return; }
  if (action.kind === "new") {
    const w = Math.abs(action.x1 - action.x0), h = Math.abs(action.y1 - action.y0);
    if (w > 4 && h > 4) {
      push();
      boxes.push({ cls, cx: (action.x0 + action.x1) / 2 / canvas.width,
                   cy: (action.y0 + action.y1) / 2 / canvas.height,
                   w: w / canvas.width, h: h / canvas.height });
      selected = boxes.length - 1; dirty = true;
    }
  }
  action = null;
  if (dirty) touch(); else draw();
});

function touch() { dirty = true; renderClasses(); draw(); save(); }

function copyPrevious() {
  if (!lastBoxes.length) { $("status").textContent = "복사할 이전 상자가 없습니다"; return; }
  push();
  boxes = boxes.concat(JSON.parse(JSON.stringify(lastBoxes)).map((b) => ({ ...b, conf: undefined })));
  selected = -1; touch();
}

async function save() {
  if (!dirty) return;
  dirty = false;
  await api(`/api/datasets/${DATASET}/labels/${index}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ boxes }), keepalive: true });   // outlives a closing tab
  dataset.files[index].labelled = true;
  dataset.files[index].boxes = boxes.length;
  renderFiles();
}

function undo() {
  const previous = history.pop();
  if (!previous) return;
  boxes = JSON.parse(previous); selected = -1; touch();
}

async function autolabel() {
  $("auto").disabled = true; $("status").textContent = "자동 라벨 중…";
  try {
    const res = await api(`/api/datasets/${DATASET}/autolabel/${index}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conf: 0.35 }) });
    push(); boxes = boxes.concat(res.boxes); selected = -1; touch();
  } catch (e) { $("status").textContent = "자동 라벨 실패: " + e.message; return; }
  finally { $("auto").disabled = false; }
  renderFiles();
}

function onKey(e) {
  if (e.code === "Space" && !spaceDown) { spaceDown = true; canvas.style.cursor = "grab"; e.preventDefault(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === "z") undo();
  else if (e.key.toLowerCase() === "c" && !e.ctrlKey && !e.metaKey) copyPrevious();
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if ((e.key === "Delete" || e.key === "Backspace") && selected >= 0) {
    push(); boxes.splice(selected, 1); selected = -1; touch();
  } else if (e.key >= "1" && e.key <= "9") {
    const i = Number(e.key) - 1;
    if (i < dataset.classes.length) setClass(i);
  } else return;
  e.preventDefault();
}

document.addEventListener("keyup", (e) => {
  if (e.code === "Space") { spaceDown = false; canvas.style.cursor = "crosshair"; }
});

$("drop").onclick = async () => {
  if (!confirm(`${dataset.files[index].name} 을(를) 데이터셋에서 지웁니다.`)) return;
  dirty = false;                                   // it is going away; do not save it back
  await api(`/api/datasets/${DATASET}/images/${index}`, { method: "DELETE" });
  dataset = await api(`/api/datasets/${DATASET}`);
  if (!dataset.files.length) { location.assign("/"); return; }
  renderFolders();
  await load(Math.min(index, dataset.files.length - 1));
};

$("copy").onclick = copyPrevious;
$("add-class").onclick = addClass;
$("new-class").onkeydown = (e) => { if (e.key === "Enter") addClass(); };
$("reset-zoom").onclick = () => { zoom = 1; applyZoom(); };
$("only-unlabelled").onchange = (e) => { onlyUnlabelled = e.target.checked; renderFiles(); };
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("folder").onchange = async (e) => {
  folder = e.target.value;
  if (inFolder(dataset.files[index])) return renderFiles();
  // jump into the folder, on a picture with boxes when it has one
  const pick = dataset.files.findIndex((f) => inFolder(f) && f.boxes > 0);
  await load(pick >= 0 ? pick : dataset.files.findIndex(inFolder));
};
$("auto").onclick = autolabel;
$("undo").onclick = undo;
$("clear").onclick = () => { push(); boxes = []; selected = -1; touch(); };
window.addEventListener("beforeunload", save);
boot();
</script>
