[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtdetr"
version = "0.6.9"
description = "Real-time object detection you can ship: RT-DETR with PyTorch training, OpenVINO inference, and a browser app. Apache-2.0 throughout."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "leeyunjai", email = "leeyunjai1982@gmail.com" }]
keywords = [
    "rt-detr", "rtdetr", "object-detection", "detr", "transformer",
    "openvino", "pytorch", "computer-vision", "real-time", "edge-ai",
    "inference", "annotation", "labeling", "apache-2.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.23",
    "opencv-python>=4.6",
    "openvino>=2024.0",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "torchvision>=0.16",
    "scipy>=1.9",
    "onnx>=1.14",
]
dev = [
    "pytest>=7.0",
    "httpx>=0.24",
    "ruff>=0.5",
    "pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/leeyunjai82/rtdetr"
Source = "https://github.com/leeyunjai82/rtdetr"
Documentation = "https://github.com/leeyunjai82/rtdetr/blob/main/docs/usage.md"
Issues = "https://github.com/leeyunjai82/rtdetr/issues"

[project.scripts]
rtdetr = "rtdetr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rtdetr"]

[tool.hatch.build.targets.sdist]
include = ["rtdetr", "tools", "tests", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests", "platform/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
